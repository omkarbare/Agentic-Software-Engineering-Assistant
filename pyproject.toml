[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "langgraph-coding-agent"
version = "0.1.0"
description = "A policy-gated, local-first coding agent built with LangGraph"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3", "langgraph>=0.2.50,<2", "langchain-core>=0.3,<2",
  "langchain-openai>=0.2,<2", "structlog>=24.4,<26", "typer>=0.12,<1",
  "httpx>=0.27,<1", "PyYAML>=6,<7", "aiosqlite>=0.20,<1", "deepeval>=2.0,<4",
  "langgraph-checkpoint-sqlite>=2.0,<4", "langgraph-checkpoint-postgres>=2.0,<4",
  "psycopg[binary,pool]>=3.2,<4", "docker>=7,<8", "python-dotenv>=1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.6,<1", "mypy>=1.11,<2", "httpx>=0.27,<1", "types-PyYAML>=6,<7"]
mcp = ["mcp>=1.2,<2"]

[project.scripts]
agent = "coding_agent.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "evals"]
addopts = "-p no:rerunfailures"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
